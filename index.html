<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Deluxe - Programmeringsprosjekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <h1>Space Shooter Deluxe</h1>
            <button id="soundToggleBtn">🔊 Lyd: PÅ</button>
        </div>

        <div class="hud">
            <span>Poeng: <strong id="scoreVal">0</strong></span>
            <span>Rekord: <strong id="highScoreVal">0</strong></span>
            <span>Liv: <strong id="livesVal">3</strong></span>
            <span>Nivå: <strong id="levelVal">1</strong></span>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="620"></canvas>

            <!-- HOVEDMENY -->
            <div id="mainMenu" class="overlay">
                <h2>Space Defender</h2>
                <p>Forsvar galaksen mot fiendtlige romskip!<br>Velg vanskelighetsgrad og trykk start.</p>
                
                <div class="difficulty-select">
                    <button class="diff-btn" data-speed="1.5" data-spawn="1100">Lett</button>
                    <button class="diff-btn active" data-speed="2.2" data-spawn="850">Normal</button>
                    <button class="diff-btn" data-speed="3.2" data-spawn="600">Vanskelig</button>
                </div>

                <button id="startBtn" class="action-btn">START SPILL</button>
            </div>

            <!-- PAUSEMENY -->
            <div id="pauseMenu" class="overlay hidden">
                <h2>PAUSE</h2>
                <p>Spillet er satt på pause.</p>
                <button id="resumeBtn" class="action-btn">FORTSETT</button>
                <button id="quitToMenuBtn" class="action-btn secondary-btn">HOVEDMENY</button>
            </div>

            <!-- GAME OVER MENY -->
            <div id="gameOverMenu" class="overlay hidden">
                <h2 style="color: #fb7185; text-shadow: 0 0 15px rgba(251, 113, 133, 0.6);">SPILL SLUTT</h2>
                <p id="finalStatsText">Du fikk 0 poeng!</p>
                <button id="restartBtn" class="action-btn">SPILL PÅ NYTT</button>
                <button id="backToMenuBtn" class="action-btn secondary-btn">HOVEDMENY</button>
            </div>
        </div>
        
        <p class="controls-hint">Styring: <strong>Pil Venstre / Høyre</strong> (flytt) • <strong>Mellomrom</strong> (skyt) • <strong>P / ESC</strong> (pause)</p>
    </div>

    <script src="./index.js"></script>
</body>
</html>
